<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4a1e"/>
      <stop offset="100%" stop-color="#1a2e12"/>
    </linearGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#cc2200" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ecdc4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#sky)"/>
  <rect x="0" y="380" width="1200" height="120" fill="url(#ground)"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="60" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="300" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="450" cy="50" r="1" fill="white" opacity="0.3"/>
  <circle cx="600" cy="35" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="750" cy="55" r="1" fill="white" opacity="0.4"/>
  <circle cx="900" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="1050" cy="45" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1150" cy="65" r="1" fill="white" opacity="0.3"/>

  <!-- ===== TITLE ===== -->
  <text x="600" y="30" text-anchor="middle" fill="#ff4444" font-size="20" font-weight="bold" filter="url(#glow)">KIZIL GÖK — SİSTEM MİMARİSİ</text>

  <!-- ===== ARAÇ (Zırhlı Muhabere Aracı) ===== -->
  <g transform="translate(80, 310)">
    <!-- Araç gövdesi -->
    <rect x="0" y="0" width="120" height="50" rx="5" fill="#3a3a3a" stroke="#555" stroke-width="2"/>
    <rect x="10" y="-15" width="40" height="18" rx="3" fill="#4a4a4a" stroke="#666" stroke-width="1"/>
    <!-- Taret -->
    <circle cx="60" cy="-5" r="12" fill="#555" stroke="#777" stroke-width="2"/>
    <line x1="60" y1="-5" x2="85" y2="-15" stroke="#666" stroke-width="3"/>
    <!-- Tekerlekler -->
    <circle cx="20" cy="55" r="10" fill="#222" stroke="#444" stroke-width="2"/>
    <circle cx="50" cy="55" r="10" fill="#222" stroke="#444" stroke-width="2"/>
    <circle cx="90" cy="55" r="10" fill="#222" stroke="#444" stroke-width="2"/>
    <!-- KIZIL GÖK püskürtücüsü -->
    <rect x="5" y="-30" width="30" height="12" rx="2" fill="#8b0000" stroke="#ff4444" stroke-width="1"/>
    <text x="20" y="-22" text-anchor="middle" fill="#ff8888" font-size="6" font-weight="bold">PÜSKÜRTÜCÜ</text>
    <!-- Anten (opsiyonel RF) -->
    <line x1="100" y1="-15" x2="115" y2="-40" stroke="#4ecdc4" stroke-width="2"/>
    <circle cx="115" cy="-42" r="4" fill="#4ecdc4" stroke="#2a9d8f" stroke-width="1"/>
  </g>

  <!-- ===== ELEKTROSTATİK BULUT ===== -->
  <ellipse cx="550" cy="280" rx="160" ry="80" fill="url(#cloud)" stroke="#ff4444" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="550" y="270" text-anchor="middle" fill="#ff8888" font-size="14" font-weight="bold">YÜKLÜ AEROSOL BULUTU</text>
  <text x="550" y="290" text-anchor="middle" fill="#ffaaaa" font-size="10">10⁴-10⁶ parçacık/m³ | 1-10 μm | >50 μC/g</text>
  
  <!-- Parçacık sembolleri (bulut içinde) -->
  <circle cx="490" cy="250" r="3" fill="#ff6666" opacity="0.8"/>
  <circle cx="520" cy="240" r="2" fill="#ff8888" opacity="0.7"/>
  <circle cx="580" cy="245" r="2.5" fill="#ff5555" opacity="0.8"/>
  <circle cx="610" cy="260" r="3" fill="#ff7777" opacity="0.7"/>
  <circle cx="470" cy="270" r="2" fill="#ff6666" opacity="0.6"/>
  <circle cx="540" cy="300" r="2.5" fill="#ff8888" opacity="0.7"/>
  <circle cx="590" cy="310" r="3" fill="#ff5555" opacity="0.8"/>
  <circle cx="630" cy="280" r="2" fill="#ff7777" opacity="0.6"/>
  
  <!-- + yüklü sembolleri -->
  <text x="495" cy="252" fill="#ffaaaa" font-size="8" font-weight="bold">+</text>
  <text x="585" cy="247" fill="#ffaaaa" font-size="8" font-weight="bold">+</text>
  <text x="545" cy="302" fill="#ffaaaa" font-size="8" font-weight="bold">+</text>

  <!-- ===== FÜZE ===== -->
  <g transform="translate(950, 200)">
    <!-- Füze gövdesi -->
    <rect x="0" y="8" width="120" height="14" rx="5" fill="#666" stroke="#888" stroke-width="1.5"/>
    <!-- Burun konisi -->
    <polygon points="120,10 150,15 120,20" fill="#555" stroke="#777" stroke-width="1"/>
    <!-- Kanatlar -->
    <polygon points="10,8 30,0 30,8" fill="#777" stroke="#999" stroke-width="1"/>
    <polygon points="10,22 30,30 30,22" fill="#777" stroke="#999" stroke-width="1"/>
    <polygon points="70,8 85,2 85,8" fill="#777" stroke="#999" stroke-width="1"/>
    <polygon points="70,22 85,28 85,22" fill="#777" stroke="#999" stroke-width="1"/>
    <!-- Alev -->
    <ellipse cx="-5" cy="15" rx="15" ry="6" fill="#ff6600" opacity="0.8"/>
    <ellipse cx="-10" cy="15" rx="10" ry="4" fill="#ffaa00" opacity="0.6"/>
    <!-- Seeker başlığı -->
    <circle cx="148" cy="15" r="4" fill="#ff0000" opacity="0.8"/>
    <text x="155" y="12" fill="#ff6666" font-size="8" font-weight="bold">SEEKER</text>
  </g>

  <!-- ===== ETKİ OKLARI ===== -->
  <!-- RF sönümleme oku -->
  <line x1="500" y1="250" x2="420" y2="210" stroke="#4ecdc4" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowblue)"/>
  <text x="400" y="200" fill="#4ecdc4" font-size="9">RF SÖNÜMLEME</text>
  <text x="400" y="212" fill="#6eeee4" font-size="8">10-30 dB</text>

  <!-- Bulut → füze oku -->
  <line x1="660" y1="250" x2="820" y2="210" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="215" fill="#ff8888" font-size="9">İNDÜKSİYON HASARI</text>
  
  <!-- Güdüme müdahale oku -->
  <line x1="620" y1="310" x2="750" y2="240" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="680" y="285" fill="#ffcc44" font-size="8">GÜDÜM BOZMA</text>

  <!-- ===== RF BAKIM IŞINI ===== -->
  <line x1="195" y1="270" x2="400" y2="260" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#glow)"/>
  <text x="280" y="255" fill="#4ecdc4" font-size="8">RF BAKIM IŞINI (opsiyonel)</text>

  <!-- ===== ETİKETLER ===== -->
  <text x="140" y="400" fill="#aaa" font-size="10" text-anchor="middle">ZIRHLI ARAÇ</text>
  <text x="1030" y="260" fill="#aaa" font-size="10" text-anchor="middle">GÜDÜMLÜ FÜZE</text>

  <!-- ===== SONUÇ KUTUSU ===== -->
  <rect x="880" y="350" width="280" height="80" rx="8" fill="#1a1a2e" stroke="#ff4444" stroke-width="1.5"/>
  <text x="1020" y="372" text-anchor="middle" fill="#ff4444" font-size="12" font-weight="bold">SONUÇ</text>
  <text x="1020" y="390" text-anchor="middle" fill="#ffaaaa" font-size="9">✗ Seeker kör → Hedef kilidi kayıp</text>
  <text x="1020" y="405" text-anchor="middle" fill="#ffaaaa" font-size="9">✗ Devre hasarı → Sistem arızası</text>
  <text x="1020" y="420" text-anchor="middle" fill="#ffaaaa" font-size="9">✗ Güdüm bozuldu → Hedeften sapma</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="430" width="350" height="55" rx="5" fill="#0a0a1a" opacity="0.8" stroke="#333"/>
  <circle cx="50" cy="448" r="5" fill="#ff4444"/>
  <text x="60" y="452" fill="#ccc" font-size="9">Yüklü aerosol bulutu</text>
  <circle cx="200" cy="448" r="5" fill="#4ecdc4"/>
  <text x="210" y="452" fill="#ccc" font-size="9">RF sinyali / bakım ışını</text>
  <circle cx="50" cy="470" r="5" fill="#ffaa00"/>
  <text x="60" y="474" fill="#ccc" font-size="9">Elektriksel hasar / Güdüm bozulması</text>
</svg>
